name: Tests

# The app sources compile directly into a headless test bundle.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26 is required."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Run offline app tests
        env:
          MACSHOT_KEEP_TEST_RESULTS: '1'
          TMPDIR: ${{ runner.temp }}
        run: scripts/run-tests.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ${{ runner.temp }}/macshot-tests.*/
          if-no-files-found: ignore
          retention-days: 7

  # Release optimization catches concurrency errors that Debug can miss.
  release-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26 is required."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Build offline app for Apple silicon and Intel
        run: |
          xcodebuild build \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          lipo "build/Build/Products/Release/MShot.app/Contents/MacOS/MShot" -verify_arch arm64 x86_64
