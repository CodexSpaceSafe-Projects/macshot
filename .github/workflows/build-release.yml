name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.5.0 or v4.5.0-beta.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_REPO: ${{ github.repository }}
      APP_PATH: build/Build/Products/Release/macshot Offline.app

    steps:
      - name: Configure release
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v4.5.0 or v4.5.0-beta.1"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* || "$RELEASE_PRERELEASE" == 'true' ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

          SIGNING_ENABLED=false
          SIGNING_SECRETS=(CERT_P12_BASE64 CERT_PASSWORD ASC_API_KEY_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID)
          for name in "${SIGNING_SECRETS[@]}"; do
            if [[ -n "${!name}" ]]; then SIGNING_ENABLED=true; fi
          done
          if [[ "$SIGNING_ENABLED" == 'true' ]]; then
            for name in "${SIGNING_SECRETS[@]}"; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Incomplete Apple signing/notarization configuration: $name is missing"
                exit 1
              fi
            done
          else
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Building an ad-hoc signed DMG without Apple notarization."
          fi
          echo "SIGNING_ENABLED=$SIGNING_ENABLED" >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release tag
        run: git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26 is required to build the macOS 26 APIs."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build offline app for Apple silicon and Intel
        run: |
          xcodebuild build \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          lipo -verify_arch arm64 x86_64 "$APP_PATH/Contents/MacOS/macshot Offline"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")
          if [[ "$BUNDLE_ID" != 'com.sw33tlie.macshot.offline' ]]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

      - name: Import signing certificate
        if: env.SIGNING_ENABLED == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          umask 077
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASS"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          trap 'rm -f "$CERT_PATH"' EXIT
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 10800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in the certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign offline app
        run: |
          SIGNING_ARGS=(--force --sign "$SIGNING_IDENTITY")
          if [[ "$SIGNING_ENABLED" == 'true' ]]; then
            SIGNING_ARGS+=(--options runtime --timestamp --keychain "$KEYCHAIN_PATH")
          fi
          # Sign embedded native runtime code, if any, before sealing the app.
          while IFS= read -r -d '' code; do
            codesign "${SIGNING_ARGS[@]}" "$code"
          done < <(find "$APP_PATH/Contents" -depth \( -name '*.dylib' -o -name '*.framework' -o -name '*.xpc' \) -print0)
          codesign "${SIGNING_ARGS[@]}" --entitlements macshot/macshot.entitlements "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Verify offline sandbox
        run: |
          codesign -d --entitlements - "$APP_PATH" > "$RUNNER_TEMP/offline-entitlements.plist"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'offline-entitlements.plist'
          entitlements = plistlib.loads(path.read_bytes())
          if entitlements.get('com.apple.security.app-sandbox') is not True:
              raise SystemExit('The offline app must remain sandboxed.')
          if any(value and key.startswith('com.apple.security.network.')
                 for key, value in entitlements.items()):
              raise SystemExit('The offline app must not have network entitlements.')
          info = plistlib.loads((Path(os.environ['APP_PATH']) / 'Contents/Info.plist').read_bytes())
          if any(key.startswith('SU') for key in info):
              raise SystemExit('The offline app must not contain updater configuration.')
          PY

      - name: Package offline DMG
        run: |
          STAGING_PATH=$(mktemp -d "$RUNNER_TEMP/macshot-dmg.XXXXXX")
          trap 'rm -rf "$STAGING_PATH"' EXIT
          ditto "$APP_PATH" "$STAGING_PATH/macshot Offline.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create -volname 'macshot Offline' -srcfolder "$STAGING_PATH" \
            -format UDZO -ov MacShot-Offline.dmg

      - name: Notarize signed DMG
        if: env.SIGNING_ENABLED == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          umask 077
          NOTARY_KEY=$(mktemp "$RUNNER_TEMP/notary-key.XXXXXX")
          trap 'rm -f "$NOTARY_KEY"' EXIT
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          xcrun notarytool submit MacShot-Offline.dmg \
            --key "$NOTARY_KEY" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --timeout 120m --output-format json > notarization-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('notarization-result.json').read_text())
          if result.get('status') != 'Accepted':
              raise SystemExit(f"Notarization was not accepted: {result.get('status')}")
          PY
          xcrun stapler staple MacShot-Offline.dmg
          xcrun stapler validate MacShot-Offline.dmg

      - name: Compute checksum
        run: shasum -a 256 MacShot-Offline.dmg > SHA256SUMS.txt

      - name: Keep release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            MacShot-Offline.dmg
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Extract release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = []
          collecting = False
          changelog = Path('CHANGELOG.md')
          for line in changelog.read_text().splitlines() if changelog.exists() else []:
              if line.startswith('## ['):
                  if collecting:
                      break
                  collecting = line.startswith(f"## [{os.environ['VERSION']}]")
              elif collecting:
                  notes.append(line)
          Path('release_notes.md').write_text('\n'.join(notes).strip())
          PY

      - name: Publish offline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" MacShot-Offline.dmg SHA256SUMS.txt --clobber
          else
            RELEASE_FLAGS=(--verify-tag --title "$RELEASE_TAG")
            if [[ "$IS_PRERELEASE" == 'true' ]]; then RELEASE_FLAGS+=(--prerelease); fi
            if [[ -s release_notes.md ]]; then
              RELEASE_FLAGS+=(--notes-file release_notes.md)
            else
              RELEASE_FLAGS+=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" MacShot-Offline.dmg SHA256SUMS.txt "${RELEASE_FLAGS[@]}"
          fi

      - name: Cleanup signing keychain
        if: ${{ always() && env.KEYCHAIN_PATH != '' }}
        run: security delete-keychain "$KEYCHAIN_PATH"
